<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registro de citas - Veterinaria Patitas Felices - Nicole Robles</title>
</head>
<body>
    <header>
        <h1>Veterinaria Patitas Felices</h1>
        <p>Registro de citas médicas</p>
    </header>
    <hr>
    <main>
        <form action="#"
              method="get"
              id="registro-citas">

            <fieldset>
                <legend>Información de la cita</legend>
                <label for="codigo">
                    Código de historia clínica:
                </label>

                <input type="text"
                       id="codigo"
                       name="codigo"
                       placeholder="HC-001"
                       maxlength="10"
                       required>
                <br><br>
                <label for="veterinario">
                    Veterinario:
                </label>
                <select id="veterinario"
                        name="veterinario"
                        required>
                    <option value="">
                        Selecciona un veterinario
                    </option>
                    <option value="andrea">
                        Dra. Andrea - Medicina general
                    </option>
                    <option value="carlos">
                        Dr. Carlos - Cirugía
                    </option>
                    <option value="sofia">
                        Sofía - Peluquería
                    </option>
                </select>
                <br><br>
                <label for="mascota">
                    Nombre de la mascota:
                </label>
                <input type="text"
                       id="mascota"
                       name="mascota"
                       placeholder="Ej. Max"
                       required>
                <br><br>
                <label for="fecha">
                    Fecha de la cita:
                </label>
                <input type="date"
                       id="fecha"
                       name="fecha"
                       required>

            </fieldset>
            <br>
            <fieldset>
                <legend>Características</legend>
                <p>Tipo de atención:</p>
                <input type="radio"
                       id="emergencia"
                       name="atencion"
                       value="emergencia"
                       required>
                <label for="emergencia">Emergencia</label>
                <input type="radio"
                       id="consulta"
                       name="atencion"
                       value="consulta">
                <label for="consulta">Consulta</label>
                <input type="radio"
                       id="control"
                       name="atencion"
                       value="control">
                <label for="control">Control</label>
                <br><br>
                <label for="peso">
                    Peso de la mascota (kg):
                </label>
                <input type="number"
                       id="peso"
                       name="peso"
                       min="1"
                       max="100"
                       value="5">
                <p>Servicios necesarios:</p>
                <input type="checkbox"
                       id="vacuna"
                       name="servicios"
                       value="vacuna">
                <label for="vacuna">
                    Vacunación
                </label>
                <br>
                <input type="checkbox"
                       id="desparasitacion"
                       name="servicios"
                       value="desparasitacion">
                <label for="desparasitacion">
                    Desparasitación
                </label>
                <br>
                <input type="checkbox"
                       id="bano"
                       name="servicios"
                       value="bano">

                <label for="bano">
                    Baño y peluquería
                </label>
            </fieldset>
            <br>
            <fieldset>
                <legend>Motivo de la consulta</legend>
                <label for="descripcion">
                    Síntomas o motivo principal:
                </label>
                <br>
                <textarea id="descripcion"
                          name="descripcion"
                          rows="5"
                          cols="45"
                          maxlength="500"
                          placeholder="Describe qué le pasa a tu mascota..."
                          required></textarea>
            </fieldset>
            <br>
            <button type="submit">
                Registrar cita
            </button>
            <button type="reset">
                Limpiar datos
            </button>
        </form>
    </main>
    <hr>
    <footer>
        <p>
            <small>
                Veterinaria Patitas Felices - 2026
            </small>
        </p>
    </footer>
</body>
</html>
