<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas - Veterinaria Patitas Felices - Nicole Robles</title>
</head>
<body>
    <h1>Tablas en HTML - Veterinaria Patitas Felices</h1>
    <table id="pacientes" border="1">
        <caption>Pacientes de la semana</caption>
        <tr>
            <th colspan="3">Pacientes atendidos</th>
        </tr>
        <tr>
            <th>Mascota</th>
            <th>Especie</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>Max</td>
            <td rowspan="2">Perro</td>
            <td>3 años</td>
        </tr>
        <tr>
            <td>Rocky</td>
            <td>5 años</td>
        </tr>
        <tr>
            <td>Michi</td>
            <td>Gato</td>
            <td>2 años</td>
        </tr>
    </table>
    <br>
    <table id="servicios" border="1">
        <caption>Precios de servicios</caption>
        <thead>
            <tr>
                <th>Servicio</th>
                <th>Duración</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Consulta general</td>
                <td>30 min</td>
                <td>$20</td>
            </tr>
            <tr>
                <td>Vacuna</td>
                <td>15 min</td>
                <td>$15</td>
            </tr>
            <tr>
                <td>Baño y peluquería</td>
                <td>1 h</td>
                <td>$25</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total de servicios</td>
                <td>3</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
