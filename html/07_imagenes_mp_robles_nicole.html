<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes - Veterinaria Patitas Felices - Nicole Robles</title>
</head>
<body>
    <h1>Utilización de la etiqueta img en la Veterinaria Patitas Felices</h1>
    <img
    src="imagenes/veterinaria/perro.jpg"
    alt="Perro labrador paciente de la veterinaria"
    width="300"
    height="250"
    loading="eager">

    <img
    src="https://placedog.net/400/300"
    alt="Perrito en consulta"
    width="300"
    height="250"
    loading="lazy">

    <img
    src="imagenes/veterinaria/gato.jpg"
    alt="Gato después de su vacuna"
    width="300"
    height="300"
    loading="eager">

    <figure>
        <img
            src="imagenes/veterinaria/perro.jpg"
            alt="Labrador sano y feliz"
            width="300"
            height="250"
            loading="eager">
        <figcaption>
            Max, nuestro paciente del mes, con todas sus vacunas al día
        </figcaption>
    </figure>

    <a href="https://www.who.int/es/news-room/fact-sheets/detail/rabies"
        target="_blank">
        <img src="imagenes/veterinaria/gato.jpg"
            alt="Información sobre la rabia"
            width="200">
    </a>
</body>
</html>
