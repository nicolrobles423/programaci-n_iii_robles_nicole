<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduccion a Javascript</title>
    <script>
        alert('Corre, Morty! al inicio de pagina');
        console.log('Saludo desde el inicio de la pagina');s
    </script>
</head>
<body>
    <h1>Incluir JavaScript en documentos HTML</h1>
    <h2>Modo Inline</h2>
    <button onclick="alert('!Corre, Morty')">
        Mostrar mensaje
    </button>
    <input type="console.log(this.value)"placeholder="Escribe algo">
    <input type="text"  onchange="console.log('Valor final guardado:', this.value)"placeholder="Escribe y haz clic fuera...">
    <input type="text"onfocus="console.log('El usuario está escribiendo aquí...')"onblur="alert('¡Atención! Saliste del campo de texto.')"placeholder="Haz clic dentro y fuera...">
    <script src="01_incluir.js"></script>
</body>
</html>
