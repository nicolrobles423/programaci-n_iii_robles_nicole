<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios - Veterinaria Patitas Felices - Nicole Robles</title>
</head>
<body>
    <h1>Registro de mascota - Veterinaria Patitas Felices</h1>
    <form action="/registro-mascota" method="post">
        <label for="dueno">Nombre del dueño</label>
        <input type="text" id="dueno" name="dueno">
        <br>
        <label for="mascota">Nombre de la mascota</label>
        <input type="text" id="mascota" name="mascota">
        <br>
        <button type="submit">Registrar</button>
    </form>
</body>
</html>
