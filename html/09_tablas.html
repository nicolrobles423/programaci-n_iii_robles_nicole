<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <h1>Tablas en HTML</h1>
    <table id="personaje-one_piece" alt ="Tabla de personajes de One Piece" border="1">
        <caption>Universo de One Piece</caption>
        <tr>
            <th colspan="3">Personajes de One Piece</th>
        </tr>
        <tr>
            <th>Personajes</th>
            <th>Tripulacion</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>Luffy</td>
            <td rowspan="2">Muguiwara</td>
            <td>19</td>
        </tr>
        <tr>
            <td>Zoro</td>
            <td>21</td>
        </tr>
        <tr>
            <td>Shanks</td>
            <td>El pelirojo</td>
            <td>41</td>
        </tr>
    </table>
    <br>
    <table id="sagas" alt ="Sagas One Piece" border="1">
        <caption>Sagas de One Piece</caption>
        <thead>
            <tr>
                <th>Saga</th>
                <th>capitulos</th>
                <th>duracion</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alabasta</td>
                <td>50</td>
                <td>500s</td>
            </tr>
            <tr>
                <td>Soul</td>
                <td>60</td>
                <td>570s</td>
            </tr>
            <tr>
                <td>East Blue</td>
                <td>61</td>
                <td>24 h</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">
                    Total de sagas
                </td>
                <td>
                    3
                </td>
            </tr>
        </tfoot>
    </table>


</body>
</html>
