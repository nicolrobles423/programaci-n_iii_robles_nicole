<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>lista</h1>
    <h1>Lista Desordenada</h1>
    <!-- Lista de elemantos sin oren especifico (unordered list)-->
    <ul>
        <li>Lufy</li>
        <li>Nami</li>
        <li>Zoro</li>
    </ul>
    <h1>Lista Ordenada</h1>
    <!-- Lista de elemantos con orden especifico (ordered list)-->
    <ol>
        <li>Sanji</li>
        <li>Robin</li>
        <li>Franki</li>
        <li>Jinbe</li>
    </ol>
     <h1>Lista Ordenada-A</h1>
    <ol type="A">
        <li>Brook</li>
        <li>Choper</li>
        <li>Usopp</li>
    </ol>
    <h1>Lista Ordenada-a</h1>
      <ol start="5">
        <li>Brook</li>
        <li>Choper</li>
        <li>Usopp</li>
    </ol>
</body>
</html>
